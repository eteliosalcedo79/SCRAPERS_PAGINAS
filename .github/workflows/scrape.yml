name: Extraer Iframes de Canales

on:
  workflow_dispatch: # 👈 Esto crea el botón "Run workflow" manual

permissions:
  contents: write # 👈 ¡ESTO ES CLAVE! Permite al robot guardar archivos en tu repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar Scraper
        run: python -u scraper.py

      - name: Guardar resultados directamente en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add canales_iframes.json
          # Solo hace commit si hay cambios, para evitar errores si se ejecuta dos veces seguidas
          git diff --staged --quiet || git commit -m "Actualización automática de canales"
          git push
