name: Scraper Universal

on:
  workflow_dispatch: # 👈 Botón manual

permissions:
  contents: write 

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Si tarda más de 10 minutos, se cancela solo para no gastar tiempo
    timeout-minutes: 10 
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright
          # Este comando instala el navegador y sus dependencias de golpe
          python -m playwright install --with-deps chromium

      - name: Ejecutar Scraper
        run: python -u scraper.py

      - name: Subir archivo HTML de depuración (Para ver desde el celular)
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          path: debug_pagina.html
          if-no-files-found: ignore 

      - name: Guardar resultados directamente en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json *.html
          git diff --staged --quiet || git commit -m "Actualización automática de canales y debug"
          git push
