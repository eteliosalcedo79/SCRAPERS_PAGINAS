name: Scraper Universal

on:
  workflow_dispatch: # 👈 Esto crea el botón "Run workflow" manual

permissions:
  contents: write # 👈 Permite al robot guardar archivos en tu repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar Scraper
        run: python -u scraper.py

      - name: Subir archivo HTML de depuración (Para ver desde el celular)
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          path: debug_pagina.html
          if-no-files-found: ignore # Si el script falla antes de crearlo, no da error

      - name: Guardar resultados directamente en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 👇 Añadimos *.html para que también guarde el debug en el repo
          git add *.json *.html
          # Solo hace commit si hay cambios
          git diff --staged --quiet || git commit -m "Actualización automática de canales y debug"
          git push
