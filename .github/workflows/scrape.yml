name: Scraper Universal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar curl_cffi directamente
        run: pip install curl_cffi

      - name: Ejecutar Scraper
        run: python -u scraper.py

      - name: Subir archivo HTML de depuración
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          path: debug_pagina.html
          if-no-files-found: ignore

      - name: Guardar resultados directamente en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json *.html
          git diff --staged --quiet || git commit -m "Actualización automática de canales y debug"
          git push
