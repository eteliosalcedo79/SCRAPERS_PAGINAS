name: Scraper Universal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright curl_cffi

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

      # Aquí se ejecuta tu scraper.py (que ahora es el script de depuración)
      - name: Ejecutar Scraper
        run: python -u scraper.py

      # ESTE ES EL PASO CLAVE: Sube los archivos generados para que los descargues
      - name: Subir archivos de depuración
        uses: actions/upload-artifact@v4
        with:
          name: html-debug
          # Aquí le decimos que busque el HTML y la captura de pantalla
          path: |
            debug_pagina.html
            debug_pantalla.png
          if-no-files-found: warn

      - name: Post Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
