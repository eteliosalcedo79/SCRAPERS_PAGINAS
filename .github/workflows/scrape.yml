name: Scraper Universal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Ejecutar Scraper
        run: python -u scraper.py

      # 👇 ESTE ES EL PASO NUEVO PARA DESCARGAR LOS ARCHIVOS DE ERROR
      - name: Subir Artefactos de Debug
        uses: actions/upload-artifact@v4
        if: always() # Se ejecuta SIEMPRE, incluso si el scraper falla
        with:
          name: archivos-debug
          path: |
            error.png
            debug.html

      - name: Guardar resultados directamente en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git diff --staged --quiet || git commit -m "Actualización automática de canales"
          git push
